<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
StreamPanel PRO
</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}"
>

</head>

<body>

<nav>

<div class="brand">
🚀 StreamPanel PRO
</div>

<a href="/">
Dashboard
</a>

<a href="/sales/">
Ventas
</a>

<a href="/customers/">
Clientes
</a>

{% if session.get("role") == "admin" %}

<a href="/products/">
Productos
</a>

<a href="/inventory/">
Inventario
</a>

<a href="/reports/">
Reportes
</a>

<a href="/users/">
Usuarios
</a>

{% endif %}

<a
class="logout"
href="/logout"
>
Cerrar sesión
</a>

</nav>


<main>

{% with messages =
get_flashed_messages() %}

{% for message in messages %}

<div class="alert">

{{ message }}

</div>

{% endfor %}

{% endwith %}


{% block content %}

{% endblock %}

</main>

</body>

</html>
