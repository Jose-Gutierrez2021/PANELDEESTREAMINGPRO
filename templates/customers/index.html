{% extends "base.html" %}

{% block content %}

<h1>
Clientes
</h1>

<form
class="card form"
method="POST"
>

<input
name="name"
placeholder="Nombre completo"
required
>

<input
name="phone"
placeholder="Teléfono / WhatsApp"
>

<input
name="email"
placeholder="Correo electrónico"
>

<textarea
name="notes"
placeholder="Notas"
></textarea>

<button>
Crear cliente
</button>

</form>


<div class="card">

<table>

<tr>

<th>
Nombre
</th>

<th>
Teléfono
</th>

<th>
Email
</th>

<th>
Fecha
</th>

</tr>

{% for customer in customers %}

<tr>

<td>
{{ customer.name }}
</td>

<td>
{{ customer.phone or "-" }}
</td>

<td>
{{ customer.email or "-" }}
</td>

<td>
{{ customer.created_at }}
</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
